<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tables — Subject & Topic-Wise Revision | Quizee</title>
    <meta name="description" content="Clean subject & topic-wise revision tables: Folk Dances, Vitamins, Constitution Articles & Parts, Schedules, Dams & Rivers, IVC Sites, Math Formulas & English Grammar.">
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- PWA & Offline Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141415">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quizee Tables">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/tables.css?v=2">

    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0b0f19;
            --card-bg: #121826;
            --card-border: #232d42;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .site-header {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav.navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 62px;
            gap: 16px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            flex-shrink: 0;
        }

        .logo-wrap img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        .logo-text {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #fff;
        }

        .nav-links-desktop {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn {
            text-decoration: none;
            color: #cbd5e1;
            font-size: 13.5px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 8px;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-btn-active {
            background: rgba(99, 102, 241, 0.2);
            color: #c7d2fe;
        }

        .nav-btn-primary {
            background: #6366f1;
            color: #fff;
        }

        .nav-btn-primary:hover {
            background: #4f46e5;
        }

        .hamburger-btn {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 7px 9px;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background: #e2e8f0;
            border-radius: 2px;
        }

        .mobile-drawer {
            display: none;
            flex-direction: column;
            background: #0f1626;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px 16px;
        }

        .mobile-drawer.open {
            display: flex;
        }

        .mobile-nav-link {
            text-decoration: none;
            color: #cbd5e1;
            padding: 9px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .mobile-nav-link.active {
            background: rgba(99, 102, 241, 0.18);
            color: #c7d2fe;
        }

        @media (max-width: 900px) {
            .nav-links-desktop { display: none; }
            .hamburger-btn { display: flex; }
        }
    
        /* =========================================================
           STUDY TABLES: COMPLETE PURGE OF YELLOW / AMBER
           ========================================================= */
        :root {
            --accent: #6366f1 !important;
            --accent-hover: #4f46e5 !important;
            --accent-tint: rgba(99, 102, 241, 0.12) !important;
            --accent-border: rgba(99, 102, 241, 0.28) !important;
            --primary: #6366f1 !important;
            --primary-glow: #818cf8 !important;
            --secondary: #4f46e5 !important;
            --amber: #6366f1 !important;
        }

        /* Completely hide row count indicators */
        .drill-card-meta,
        .reader-kicker .row-count {
            display: none !important;
        }

        /* Reader Kicker & Titles: Cool Indigo / Slate */
        .reader-kicker {
            color: #818cf8 !important;
        }

        /* Subject Tab Buttons & Badges: Cool Indigo / Slate (Zero Yellow) */
        .subject-tab-btn.active {
            border-color: #6366f1 !important;
            color: #ffffff !important;
        }

        .subject-tab-btn.active .tab-svg-icon {
            color: #818cf8 !important;
        }

        .subject-tab-btn.active .tab-count-badge {
            background: rgba(99, 102, 241, 0.16) !important;
            color: #c7d2fe !important;
        }

        .sb-subject-btn.active .sb-count {
            color: #818cf8 !important;
        }

        .sb-subject-btn.active,
        .sb-topic-btn.active {
            border-color: rgba(99, 102, 241, 0.4) !important;
        }

        /* Drill Cards & Hover: Indigo accents */
        .drill-card:hover {
            border-color: rgba(99, 102, 241, 0.4) !important;
        }

        .drill-card:hover .drill-card-arrow {
            color: #818cf8 !important;
        }

        .search-wrap:focus-within,
        .search-wrap input:focus,
        .tables-search-input:focus {
            border-color: #6366f1 !important;
        }

        /* Search highlights: Cool Indigo / Ice (Zero Yellow) */
        mark.hl {
            background: rgba(99, 102, 241, 0.25) !important;
            color: #e0e7ff !important;
        }

        /* Memorize / Recall Button: Mint Emerald */
        .btn-recall.active {
            background: rgba(16, 185, 129, 0.16) !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
            color: #6ee7b7 !important;
        }

        /* Clean Table Hover */
        .clean-table tr:hover td {
            background: rgba(99, 102, 241, 0.05) !important;
        }

    </style>
    <link rel="stylesheet" href="assets/quizee-theme.css?v=7">
</head>
<body class="page-tables">
    <audio id="quizeAudioPlayer" preload="auto">
        <source src="assets/quzeaudio.mp3" type="audio/mpeg">
        <source src="assets/quzeaudio.mpeg" type="audio/mpeg">
    </audio>

    <header class="site-header">
        <div class="nav-container">
            <nav class="navbar">
                <a href="index.html" class="logo-wrap">
                    <img src="assets/icon.png" alt="Quizee" width="32" height="32">
                    <span class="logo-text">Quizee</span>
                </a>

                <div class="nav-links-desktop">
                    <a href="index.html" class="nav-btn">Home</a>
                    <a href="index.html#online-tests" class="nav-btn">Topic Sets</a>
                    <a href="mock-tests.html" class="nav-btn">Full Mocks</a>
                    <a href="byjus-gk.html" class="nav-btn">BYJU'S GK</a>
                    <a href="tables.html" class="nav-btn nav-btn-active">Study Tables</a>
                    <a href="tasks.html" class="nav-btn">Tasks</a>
                    <button class="nav-btn-audio quize-audio-btn" type="button" title="Play Quizee Music">
                        <span class="audio-btn-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
                        <span class="audio-btn-text">Music</span>
                    </button>
                    <a href="quizee.apk" download="quizee.apk" class="nav-btn nav-btn-primary">Download APK</a>
                </div>

                <div class="nav-mobile-actions">
                    <button class="nav-btn-mobile-audio quize-audio-btn" type="button" aria-label="Play Music" title="Play Quizee Music">
                        <span class="audio-btn-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
                    </button>
                    <button class="hamburger-btn" id="tablesMobileToggle" aria-label="Menu">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="mobile-drawer" id="tablesMobileDrawer">
            <a href="index.html" class="mobile-nav-link">Home</a>
            <a href="index.html#online-tests" class="mobile-nav-link">Topic Practice Sets</a>
            <a href="mock-tests.html" class="mobile-nav-link">Full Mock Tests</a>
            <a href="byjus-gk.html" class="mobile-nav-link">BYJU'S GK</a>
            <a href="tables.html" class="mobile-nav-link active">Study Tables</a>
            <a href="tasks.html" class="mobile-nav-link">Syllabus Tasks</a>
        </div>
    </header>

    <main class="tables-shell">
        <!-- Compact Top Bar -->
        <div class="tables-topbar">
            <div class="topbar-title-group">
                <h1>Study Tables</h1>
            </div>

            <div class="topbar-controls">
                <div class="search-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="tablesSearchInput" placeholder="Search topic or fact" autocomplete="off">
                    <button type="button" id="btnClearSearch" class="btn-clear" title="Clear">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <button type="button" id="btnRecallToggle" class="btn-recall" style="display:none;" title="Hide answer columns so you can test yourself">
                    Hide Answers
                </button>
            </div>
        </div>

        <!-- Step-by-Step Drill-Down Stage (Subjects -> Topics -> Table Reader) -->
        <div id="tablesBreadcrumb" class="drill-breadcrumb" style="display:none;"></div>
        <section id="tablesStage" class="tables-stage"></section>
    </main>

    <button type="button" id="btnBackToTop" class="btn-back-top" aria-label="Back to Top">↑</button>

    <script src="data/study_tables_data.js"></script>
    <script src="data/byjus_gk_data.js"></script>
    <script src="assets/tables.js?v=5"></script>
    <script>
        const tablesToggle = document.getElementById('tablesMobileToggle');
        const tablesDrawer = document.getElementById('tablesMobileDrawer');
        if (tablesToggle && tablesDrawer) {
            tablesToggle.addEventListener('click', () => {
                tablesToggle.classList.toggle('active');
                tablesDrawer.classList.toggle('active');
            });
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
            });
        }
    </script>
    <script src="assets/quizee-audio.js?v=1"></script>
</body>
</html>
