name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            BUILD_CODE=$?
            echo "====================== BUILD LOG FAILURE ======================"
            tail -n 120 build_output.log
            echo "================================================================"
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Upload Build Reports if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Push Build Log to Git on Failure
        if: failure()
        run: |
          git config user.name "Kunal18sm"
          git config user.email "Kunal18sm@users.noreply.github.com"
          git checkout -B ci-debug
          cp build_output.log ci_build_error.log || true
          git add ci_build_error.log
          git commit -m "ci: capture build error log" || true
          git push -f origin ci-debug || true

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.1
          name: "Quizee v2.4.1 - Bottom Navigation Bar, 50 Qs Drill & Mistakes Review"
          body: |
            ## 📱 Quizee App v2.4.1 Released!
            - **📱 Modern Bottom Navigation Bar**:
              - Clean 4-tab interface separating **Daily Target**, **Practice Hub**, **App Locker**, and **Question Bank**.
              - Eliminates chaotic single-screen scrolling with fast, organized, dedicated modular views.
            - **⚡ 50 Questions Drill vs Full Set Option**:
              - In Custom Practice Sets (100 Qs), choose between a rapid **⚡ 50 Qs Drill** (randomly sampled) or the **📖 Full Set (100 Qs)**.
              - Works seamlessly for individual sets or multi-topic mixed mock drills.
            - **❌ Dedicated Mistakes & Wrong Answers Section**:
              - Dedicated alert card on test completion showing all wrong questions in one place.
              - **"⚡ Retest Mistakes Only"**: Instantly launches a focused drill on only the questions you missed!
              - Interactive review filters: **All**, **❌ Wrong**, **✓ Correct**, **⏭️ Skipped**.
            - **🛡️ Notification Lock Fix**:
              - Strictly ignores background notifications (e.g. YouTube, WhatsApp, FCM) so the quiz only triggers when you genuinely launch the locked app into the foreground.
            - **📚 6,517 High-Yield Questions**:
              - 100% offline SSC CGL curriculum across English Vocab, Static GK, History, Geography, Biology, Polity, and Economics.
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
