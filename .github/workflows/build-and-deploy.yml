name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            BUILD_CODE=$?
            echo "====================== BUILD LOG FAILURE ======================"
            tail -n 120 build_output.log
            echo "================================================================"
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Upload Build Reports if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Push Build Log to Git on Failure
        if: failure()
        run: |
          git config user.name "Kunal18sm"
          git config user.email "Kunal18sm@users.noreply.github.com"
          git checkout -B ci-debug
          cp build_output.log ci_build_error.log || true
          git add ci_build_error.log
          git commit -m "ci: capture build error log" || true
          git push -f origin ci-debug || true

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "Quizee v2.4.0 - Ultimate Custom Practice Hub & Notification Fix"
          body: |
            ## 📱 Quizee App v2.4.0 Released!
            - **🎯 Ultimate Custom Practice Hub**:
              - **Subject Filter**: Practice complete subjects (English, Static GK, History, Geography, Biology, Polity, Economics).
              - **Topic Drill-down**: Practice specific chapters (Antonyms, Synonyms, Freedom Struggle, Dances of India, National Parks, etc.).
              - **100-Question Sequential Sets**: Topics chunked into structured Sets of 100 questions (e.g. Set 1: 1-100, Set 2: 101-200) with visual mastery badges (🏆 Mastered, ⚠️ Needs Revision, ⚪ Unattempted).
              - **Multi-Topic Mixed Mock Builder**: Check multiple topics to generate customized 25, 50, or 100 question mock tests!
              - **"Resume Where You Left Off" Banner**: Jump right back into your last practiced set with 1 tap.
            - **🛡️ Notification Lock Fix**: Fixed bug where incoming notifications (like YouTube, WhatsApp, FCM sync) erroneously triggered the quiz overlay. Quiz overlay now strictly triggers only when the locked app's activity is launched into the foreground!
            - **Sequential Daily Learning Engine**: Practice 30 (or 20) structured questions daily with Mistake-Priority Spaced Repetition.
            - **100% High-Yield SSC CGL Bank (6,517 MCQs)**: All low-yield filler questions pruned away for maximum retention.
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
