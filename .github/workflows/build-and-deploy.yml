name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Reports if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: "Quizee v2.0.2 (Direct App Overlay + Open App Flow + True Dark Theme)"
          body: |
            ## 📱 Quizee App v2.0.2 Released!
            - **Direct App Overlay**: Quiz card appears directly ON TOP of the selected app (e.g. YouTube, Instagram), without switching to Quizee app!
            - **Open App Flow**: After answering 5 MCQs (right or wrong), tap the dedicated 'Open App' button to launch the locked application.
            - **Permanent True Dark Theme**: Complete dark mode aesthetic across the entire app and components.
            - **Android 13/14/15 Support**: Removed QUERY_ALL_PACKAGES for Play Protect safety, added Restricted Settings guide.
            - **2,584 Static GK Questions**: Comprehensive question bank from 2026 syllabus.
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
