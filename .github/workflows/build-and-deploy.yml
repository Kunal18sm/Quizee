name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Quizee v1.0 (Static GK 2026 Edition)"
          body: |
            ## 📱 Quizee App v1.0 Released!
            - **2,580+ Static GK Questions** from the 2026 syllabus
            - **App Locker**: Answer 5 MCQs to unlock your selected apps
            - **Instant Feedback**: Green ✓ for correct, Red ✗ for wrong
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
