name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            BUILD_CODE=$?
            echo "====================== BUILD LOG FAILURE ======================"
            tail -n 120 build_output.log
            echo "================================================================"
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Upload Build Reports if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Push Build Log to Git on Failure
        if: failure()
        run: |
          git config user.name "Kunal18sm"
          git config user.email "Kunal18sm@users.noreply.github.com"
          git checkout -B ci-debug
          cp build_output.log ci_build_error.log || true
          git add ci_build_error.log
          git commit -m "ci: capture build error log" || true
          git push -f origin ci-debug || true

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "Quizee v2.1.0 (5,300+ Static GK & BlackBook English Vocabulary MCQs)"
          body: |
            ## 📱 Quizee App v2.1.0 Released!
            - **Massive 5,315 Questions Bank**: Complete BlackBook English Vocabulary (2,731 questions) + 2026 Static GK (2,584 questions)!
            - **Complete English Vocabulary Coverage**:
              - One Word Substitutions (OWS Top 200 & SSC Masters)
              - Idioms & Phrases (Top 200 & PYQs)
              - Synonyms & Antonyms (Common List & Most Repeated)
              - Correct Spelling Tests (200 Most Repeated)
              - Phrasal Verbs & Fixed Prepositions
              - Confusing Homonyms & Homophones
              - The Hindu Vocabulary & Foreign Words & Root Words
            - **3/5 Passing Rule**: Minimum 3 correct answers required out of 5 to unlock any app!
            - **Instant Revision / Retry**: If score < 3, app stays locked and lets you retry the exact same questions until you learn and pass.
            - **Direct App Overlay**: Quiz card appears directly ON TOP of the selected app (e.g. YouTube, Instagram), without switching to Quizee app!
            - **Permanent True Dark Theme & 3D Brand Icon**: Premium glowing padlock + quiz question mark logo.
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
