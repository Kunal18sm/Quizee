name: Build Quizee APK and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            BUILD_CODE=$?
            echo "====================== BUILD LOG FAILURE ======================"
            tail -n 120 build_output.log
            echo "================================================================"
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Upload Build Reports if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Push Build Log to Git on Failure
        if: failure()
        run: |
          git config user.name "Kunal18sm"
          git config user.email "Kunal18sm@users.noreply.github.com"
          git checkout -B ci-debug
          cp build_output.log ci_build_error.log || true
          git add ci_build_error.log
          git commit -m "ci: capture build error log" || true
          git push -f origin ci-debug || true

      - name: Copy Generated APK to Website docs and root
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/quizee.apk
          cp app/build/outputs/apk/debug/app-debug.apk quizee.apk
          cp index.html docs/index.html || true
          cp mock-tests.html docs/mock-tests.html || true
          cp sw.js docs/sw.js || true
          cp manifest.json docs/manifest.json || true
          ls -lh docs/quizee.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quizee-APK
          path: docs/quizee.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1
          name: "Quizee v3.1.1 - Fully Responsive Widgets for Full-Screen & Compact Sizes + Custom Topic Widgets"
          body: |
            ## 📱 Quizee App v3.1.1 Released!
            - **✨ Fully Responsive Home Screen Widgets**:
              - Fixed vertical option button stretching on tall/full-screen widget sizes.
              - Added dedicated expanded layouts with cards, increased line count, bilingual question support, and proportioned option buttons.
              - Live on-resize updates when stretching or resizing widgets.
            - **🧩 2 Interactive Home Screen Widget Types**:
              - **1. Daily Target Quiz Widget**: Daily 30-question syllabus bank, live streak counter, instant answer feedback & next question button.
              - **2. Custom Topic & Set Widget**: Select any Subject (English, Static GK, History, Geography, Biology, Polity, Economics), Topic, and 100-Question Set.
              - **⚙️ Reconfigure Anytime**: Tap the ⚙️ icon on the widget to switch topics or sets anytime.
              - **📌 1-Tap Home Screen Pinning**: Add widgets to your home screen directly from within the app with 1 tap.
            - **📚 7,480+ High-Yield SSC CGL Questions & 60 Full-Length Mock Tests**.
            - Download `quizee.apk` below directly on your Android phone!
          files: docs/quizee.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated APK to Git Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quizee.apk docs/quizee.apk
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update quizee.apk binary to v3.1.1 [skip ci]"
          git push origin main || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
